server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: incode-integration-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

incode:
  integration:
    base-url: ${INCODE_BASE_URL:https://demo-api.incodesmile.com}
    api-key: ${INCODE_API_KEY:replace-with-incode-api-key}
    api-version: ${INCODE_API_VERSION:1.0}
    connect-timeout: ${INCODE_CONNECT_TIMEOUT:5000}
    read-timeout: ${INCODE_READ_TIMEOUT:15000}
    webhook:
      secret: ${INCODE_WEBHOOK_SECRET:replace-with-incode-webhook-secret}
      signature-header: ${INCODE_WEBHOOK_SIGNATURE_HEADER:X-Incode-Signature}
    tls:
      verify-hostname: ${INCODE_TLS_VERIFY_HOSTNAME:true}
      protocol: ${INCODE_TLS_PROTOCOL:TLSv1.3}

camel:
  springboot:
    name: incode-integration-camel-context
    main-run-controller: false
  component:
    http:
      connections-per-route: 50
      max-total-connections: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.incode.integration: INFO
    org.apache.camel: INFO

